<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
  <title id="title">작업이 재개되어도 기본 조회 범위 밖에 남는 구간</title>
  <desc id="desc">최근 1시간을 조회하는 가상 예시. 10시의 마지막 성공 요청은 9시부터 10시까지 조회했다. 이후 호출이 중단되고 13시에 재개된 요청은 12시부터 13시까지 조회한다. 10시부터 12시까지는 별도로 복구해야 한다.</desc>
  <rect width="960" height="290" rx="16" fill="#f8fafc"/>
  <g transform="translate(0 -88)" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#172033">
    <g text-anchor="middle" font-size="18">
      <text x="240" y="128">09:00</text><text x="405" y="128">10:00</text>
      <text x="570" y="128">11:00</text><text x="735" y="128">12:00</text><text x="900" y="128">13:00</text>
    </g>
    <g stroke="#cbd5e1" stroke-dasharray="4 5">
      <path d="M240 143V339"/><path d="M405 143V339"/><path d="M570 143V339"/><path d="M735 143V339"/><path d="M900 143V339"/>
    </g>
    <g font-size="18">
      <text x="40" y="181">마지막 성공 요청</text>
      <rect x="240" y="150" width="165" height="48" rx="6" fill="#dcfce7" stroke="#15803d"/>
      <text x="322" y="181" text-anchor="middle" fill="#166534">조회 성공</text>
      <text x="40" y="251">재개 후 기본 조회</text>
      <rect x="735" y="220" width="165" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>
      <text x="817" y="251" text-anchor="middle" fill="#1e40af">최근 1시간</text>
      <text x="40" y="321">별도 복구할 구간</text>
      <rect x="405" y="290" width="330" height="48" rx="6" fill="#ffedd5" stroke="#c2410c"/>
      <text x="570" y="321" text-anchor="middle" fill="#9a3412" font-weight="700">10:00 ~ 12:00 · 미호출 구간</text>
    </g>
  </g>
</svg>
